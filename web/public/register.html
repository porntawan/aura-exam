<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #36b9cc, #4e73df);
    }

    .register-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 420px;
    }

    .register-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #555;
    }

    .form-group input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        transition: border 0.3s;
    }

    .form-group input:focus {
        border-color: #36b9cc;
        outline: none;
    }

    button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background-color: #36b9cc;
        color: white;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    button:hover {
        background-color: #2c9faf;
    }

    .login-link {
        text-align: center;
        margin-top: 15px;
        font-size: 13px;
    }

    .login-link a {
        color: #4e73df;
        text-decoration: none;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .register-container {
            padding: 25px;
        }
    }
</style>
</head>

<body>

<div class="register-container">
    <h2>Register</h2>

    <form action="/login" method="post">
        <div class="form-group">
            <label for="name">Name</label>
            <input 
                type="text" 
                id="name" 
                placeholder="Enter your name" 
                required 
                minlength="2">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                placeholder="Enter your email" 
                required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Create a password" 
                required 
                minlength="6">
        </div>

        <button type="submit">Create Account</button>

        <div class="login-link">
            มีบัญชีอยู่แล้ว? <a href="/login">Login</a>
        </div>
    </form>
</div>

</body>
</html>
