<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #4e73df, #1cc88a);
    }

    .login-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 400px;
    }

    .login-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #555;
    }

    .form-group input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        transition: border 0.3s;
    }

    .form-group input:focus {
        border-color: #4e73df;
        outline: none;
    }

    .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-login {
        background-color: #4e73df;
        color: white;
    }

    .btn-login:hover {
        background-color: #2e59d9;
    }

    .btn-register {
        background-color: #858796;
        color: white;
    }

    .btn-register:hover {
        background-color: #60616f;
    }

    @media (max-width: 480px) {
        .login-container {
            padding: 25px;
        }
    }
</style>
</head>

<body>

<div class="login-container">
    <h2>Login</h2>

    <form action="/products" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-login">Login</button>
            <a href="/register">
                <button type="button" class="btn-register">Register</button>
            </a>
        </div>
    </form>
</div>

</body>
</html>
